<div class="row align-items-start">
  
  <!-- الكارت -->
  <div class="col-md-5">
    <div
      class="p-4 border rounded shadow-sm bg-light"
      appHighlightCard="gray"
      externalColor="'pink'"
    >
      <img
        [src]="product?.imgUrl"
        class="card-img-top"
        [alt]="product?.name"
      />

      <div class="card-body">
        <p class="card-text">Quantity: {{ product?.quantity }}</p>
      </div>
    </div>
  </div>

  <!-- التفاصيل -->
  <div class="col-md-7">
    <h2>{{ product?.name }}</h2>
    <p><strong>ID:</strong> {{ product?.id }}</p>
    <p><strong>Price:</strong> ${{ product?.price }}</p>
    <p><strong>Category:</strong> {{ product?.catId }}</p>

    <div class="d-flex gap-2 mt-3">
      <button
        class="btn btn-danger"
        [disabled]="currentId === idsArr[0]"
        (click)="prev()"
      >
        Prev
      </button>

      <button
        class="btn btn-success"
        [disabled]="currentId === idsArr[idsArr.length - 1]"
        (click)="next()"
      >
        Next
      </button>

      <button class="btn btn-primary" (click)="goBack()">
        Back
      </button>
    </div>
  </div>

</div>
