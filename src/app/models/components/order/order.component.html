<div class="mb-3">
  <select class="form-select form-select-lg" [(ngModel)]="selectedCatId">
    <option [ngValue]="0">All Categories</option>
    <option *ngFor="let cat of categories" [ngValue]="cat.id">{{cat.name}}</option>
  </select>
</div>


<div class="bg-warning">
    
    <app-product [receivedCatId]="selectedCatId" (OnPriceChanged)="calcTotalPrice($event)"></app-product>
</div>

<h1>{{receivedTotalPrice}}</h1>

<input type="text" #inp>
