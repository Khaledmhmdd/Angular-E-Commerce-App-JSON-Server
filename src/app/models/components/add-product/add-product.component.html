<h1>{{newProduct|json }}</h1>
<div class="container mt-12">
    <form (submit)="addNewProduct()" #form="ngForm">
        <!-- <div class="mb-5">
        <label for="id" class="form-label">Id:</label>
        <input type="number" [(ngModel)]="newProduct.id" name="id" class="form-control" id="id">
    </div> -->
        <div class="mb-5">
            <label for="name" class="form-label">Name:</label>

            <input type="text" class="form-control" id="name" name="name" [(ngModel)]="newProduct.name" required
                pattern="^[a-zA-Z]{3,15}$" #prdName="ngModel">

            @if (prdName.invalid && prdName.touched) {
            <div class="text-danger">

                @if (prdName.errors?.['required']) {
                <p>Name is required</p>
                }

                @if (prdName.errors?.['pattern']) {
                <p>Name must be 3–15 letters only</p>
                }

            </div>
            }
        </div>


        <div class="mb-5">
            <label for="price" class="form-label">Price:</label>
            <input type="number" [(ngModel)]="newProduct.price" name="price" class="form-control" id="price">
        </div>

        <div class="mb-5">
            <label for="quantity" class="form-label">Quantity:</label>
            <input type="number" [(ngModel)]="newProduct.quantity" name="quantity" class="form-control" id="quantity">
        </div>

        <div class="mb-5">
            <label for="imgUrl" class="form-label">Image:</label>
            <input type="file" [(ngModel)]="newProduct.imgUrl" name="imgUrl" class="form-control" id="imgUrl">
        </div>

        <div class="mb-5">

            <label for="category" class="form-label">Categories:</label>
            <select name="category" [(ngModel)]="newProduct.catId" name="catId" class="form-select" id="category">
                @for (cat of categories; track cat.id) {
                <option [value]="cat.id">{{ cat.name }}</option>
                }

            </select>
        </div>

        <button type="submit" [disabled]="form.invalid" class="btn btn-primary">Submit</button>
    </form>
</div>
